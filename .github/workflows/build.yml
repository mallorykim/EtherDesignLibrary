name: Build

# Hosted windows-latest runs static contracts, resource audits, package
# restore, and unsigned MSIX package produce (build-only, no GUI). It does not
# launch WinUI. Gallery smoke (Light/Dark 20/20) and L3 consumer runtime
# markers are owned by scripts/Verify-RuntimeGates.ps1 on a local Windows
# desktop, or a future self-hosted interactive runner, before preview publish.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Ether.DesignSystem.slnx -p:Platform=x64
      - name: Build (${{ matrix.configuration }}, x64)
        run: dotnet build Ether.DesignSystem.slnx -c ${{ matrix.configuration }} -p:Platform=x64 --no-restore

  package-consumers:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Audit scripts/*.ps1 for Windows PowerShell 5.1 incompatibilities
        shell: pwsh
        # CI runs every scripts/*.ps1 with shell: pwsh (PowerShell 7+), so a 5.1-only failure
        # never shows up here - it only surfaces when a contributor runs a script locally with
        # the Windows-default `powershell`. This is a pure AST static check (no script is
        # executed), so it runs first and fails fast.
        run: ./scripts/Verify-PowerShellCompatibility.ps1
      - name: Audit frozen tokens and theme resource keys
        shell: pwsh
        run: ./scripts/Verify-ResourceKeys.ps1 -RequireHighContrastParity
      - name: Audit public resource merge graph
        shell: pwsh
        run: ./scripts/Verify-ResourceGraph.ps1
      - name: Audit marker field contract (PowerShell vs C# records)
        shell: pwsh
        # Purely static: catches a PowerShell/C# marker-field mismatch (e.g. a renamed record
        # field) before it costs a full GUI runtime-verification round to discover.
        run: ./scripts/Verify-MarkerContract.ps1
      - name: Verify EtherProgressBar exemplar contract
        shell: pwsh
        run: ./scripts/Verify-EtherProgressBarContract.ps1
      - name: Verify EtherButton L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherButtonContract.ps1
      - name: Verify EtherCheckbox L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherCheckboxContract.ps1
      - name: Verify EtherRadioButton L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherRadioButtonContract.ps1
      - name: Verify EtherInput L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherInputContract.ps1
      - name: Verify EtherDropdown L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherDropdownContract.ps1
      - name: Verify EtherSegmentedControl L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherSegmentedControlContract.ps1
      - name: Verify EtherIntelligenceButton L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherIntelligenceButtonContract.ps1
      - name: Verify EtherSteeringBar L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherSteeringBarContract.ps1
      - name: Verify EtherSlider L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherSliderContract.ps1
      - name: Verify EtherMasthead L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherMastheadContract.ps1
      - name: Verify EtherSwitch L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherSwitchContract.ps1
      - name: Verify EtherScrollBar L3 contract
        shell: pwsh
        run: ./scripts/Verify-EtherScrollBarContract.ps1
      - name: Verify silently-ineffective public properties are documented and genuinely unconsumed
        shell: pwsh
        run: ./scripts/Verify-UnsupportedProperties.ps1
      - name: Verify backend-consumable interaction contracts
        shell: pwsh
        run: ./scripts/Verify-InteractionContracts.ps1
      - name: Verify WinUI 3 control conventions
        shell: pwsh
        run: ./scripts/Verify-WinUiConventions.ps1
      - name: Verify High Contrast foreground/background pairing
        shell: pwsh
        run: ./scripts/Verify-HighContrastPairing.ps1
      - name: Verify Gallery ControlExample contract
        shell: pwsh
        run: ./scripts/Verify-GalleryControlExample.ps1
      - name: Verify Gallery localization contract
        shell: pwsh
        run: ./scripts/Verify-GalleryLocalization.ps1
      - name: Verify package consumers
        shell: pwsh
        # Hosted runners pack/restore fixtures only. GUI runtime markers stay on
        # scripts/Verify-RuntimeGates.ps1 because hosted WinUI launch is unreliable.
        run: ./scripts/Verify-ConsumerFixtures.ps1 -SkipSolutionBuild -SkipRuntimeSmoke
      - name: Verify unsigned MSIX produce
        shell: pwsh
        # Builds the Packaged fixture with GenerateAppxPackageOnBuild=true and asserts a
        # non-trivial .msix/.msixbundle exists under AppPackages. This is a pure MSBuild/
        # Windows SDK packaging step (AppxPackageSigningEnabled=false, no signing, no
        # install, no launch) - it needs no GUI or interactive desktop session, unlike the
        # GUI runtime markers above, so it is safe to run on this hosted runner. Must run
        # after "Verify package consumers", which packs Foundation/Controls/Interactions
        # into the local feed this fixture restores from.
        run: ./scripts/Verify-MsixPackage.ps1 -SkipSolutionBuild
